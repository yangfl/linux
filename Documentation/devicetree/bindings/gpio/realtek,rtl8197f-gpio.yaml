%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/realtek,rtl8197f-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8197F GPIO controller

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The RTL8197F provides two identical banks of 32 GPIOs, known in the vendor
  documentation as ports ABCD (bank 0, at 0x18003500) and EFGH (bank 1, at
  0x1800351c).  Each bank is a separate device node with its own interrupt
  line cascading from the SoC interrupt controller (realtek,rtl8197f-intc),
  inputs 16 (ports ABCD) and 17 (ports EFGH) respectively.

  Interrupts are edge triggered only (rising, falling or both edges); level
  triggered interrupts are not implemented in hardware.  Interrupt children
  must specify their trigger type explicitly (an unspecified trigger leaves
  the pin's interrupt mask bit clear and the interrupt silent).

  There is no pinctrl hardware on this SoC: pin muxing is done by writing to
  global system registers and is not managed by this controller.  Some pins
  (notably parts of ports B and H) are muxed with the switch LED outputs and
  must not be claimed as GPIOs when LED output is required.

  All 32 pins of each bank are exposed unconditionally.  The vendor BSP
  marks a number of pins as output-only and leaves some port H pins with
  no mux table entry at all; claiming such a pin as an input silently
  reads back undefined levels.  Board device trees must only reference
  pins known to be wired as GPIOs.

properties:
  compatible:
    const: realtek,rtl8197f-gpio

  reg:
    maxItems: 1

  gpio-controller: true

  "#gpio-cells":
    const: 2

  interrupt-controller: true

  "#interrupt-cells":
    const: 2

  interrupts:
    maxItems: 1
    description: Interrupt line of this bank in the parent SoC interrupt
      controller (input 16 for bank 0, input 17 for bank 1).

required:
  - compatible
  - reg
  - gpio-controller
  - "#gpio-cells"

allOf:
  - if:
      required: [interrupt-controller]
    then:
      required:
        - "#interrupt-cells"
        - interrupts

additionalProperties: false

examples:
  - |
    gpio0: gpio@3500 {
      compatible = "realtek,rtl8197f-gpio";
      reg = <0x3500 0x1c>;

      gpio-controller;
      #gpio-cells = <2>;

      interrupt-controller;
      #interrupt-cells = <2>;

      interrupt-parent = <&intc>;
      interrupts = <16 0>;
    };

    gpio1: gpio@351c {
      compatible = "realtek,rtl8197f-gpio";
      reg = <0x351c 0x1c>;

      gpio-controller;
      #gpio-cells = <2>;

      interrupt-controller;
      #interrupt-cells = <2>;

      interrupt-parent = <&intc>;
      interrupts = <17 0>;
    };

...
