%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/realtek/realtek,rtl8197f-syscon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8197F system controller

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The RTL8197F system controller bundles miscellaneous SoC-wide registers
  (pin multiplexing, bus and clock gates, strap options) behind a single
  register window at 0x18000000.  It is exposed as a syscon so that
  drivers for blocks without a dedicated region of their own (USB PHY,
  PCIe) can reach the few registers they need.

properties:
  compatible:
    items:
      - const: realtek,rtl8197f-syscon
      - const: syscon
      - const: simple-mfd

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  ranges:
    maxItems: 1

patternProperties:
  '^clock-controller@[0-9a-f]+$':
    $ref: /schemas/clock/realtek,rtl8197f-clock.yaml

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@0 {
        compatible = "realtek,rtl8197f-syscon", "syscon",
                     "simple-mfd";
        reg = <0x0 0x200>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0x0 0x0 0x200>;

        clock-controller@0 {
            compatible = "realtek,rtl8197f-clock";
            reg = <0x0 0x68>;
            #clock-cells = <1>;
        };
    };
...
