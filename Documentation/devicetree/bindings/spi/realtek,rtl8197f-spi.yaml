%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/realtek,rtl8197f-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8197F SPI flash controller

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The RTL8197F (and other RTL819x SoCs) contain a SPI flash controller
  derived from the Synopsys DesignWare SSI, located at 0x18143000.  It is a
  half-duplex, single-lane controller intended to drive a SPI NOR flash
  chip, and works together with the SPI NOR framework (jedec,spi-nor).

  The register layout follows the DesignWare APB SSI, but the transfer
  engine carries vendor extensions and silicon quirks (flash-extension
  registers, NDF frame-count semantics, unreliable RXFLR) which make it
  incompatible with a plain DesignWare SSI in software.  It therefore
  carries no "snps,dw-apb-ssi" fallback compatible and is driven by
  drivers/spi/spi-realtek-rtl819x.c, which reuses the DesignWare core for the
  host registration but replaces its mem-ops transfer engine.

  This controller is unrelated to the simpler SPI flash controller found in
  the Realtek Otto SoCs (RTL8380/8382/8391/8392/8393), which has a
  completely different register layout and uses the "realtek,rtl8380-spi"
  family of compatibles.

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    const: realtek,rtl8197f-spi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  num-cs:
    description: Number of chip selects, up to 16.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 16
    default: 1

required:
  - compatible
  - reg
  - clocks
  - "#address-cells"
  - "#size-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/realtek-rtl819x-clks.h>

    syscon@18000000 {
        compatible = "realtek,rtl8197f-syscon", "syscon", "simple-mfd";
        reg = <0x18000000 0x200>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0x0 0x18000000 0x200>;

        sysclk: clock-controller@0 {
            compatible = "realtek,rtl8197f-clock";
            reg = <0x0 0x68>;
            #clock-cells = <1>;
        };
    };

    spi0: spi@18143000 {
        compatible = "realtek,rtl8197f-spi";
        reg = <0x18143000 0x1000>;
        clocks = <&sysclk RTL8197F_CLK_SPI>;
        num-cs = <1>;
        #address-cells = <1>;
        #size-cells = <0>;

        flash@0 {
            compatible = "jedec,spi-nor";
            reg = <0>;
            /* the vendor-validated SPI clock / 8 */
            spi-max-frequency = <12500000>;

            partitions {
                compatible = "fixed-partitions";
                #address-cells = <1>;
                #size-cells = <1>;

                partition@0 {
                    label = "boot";
                    reg = <0x0 0x40000>;
                    read-only;
                };

                partition@40000 {
                    label = "firmware";
                    reg = <0x40000 0x1fc0000>;
                };
            };
        };
    };
...
