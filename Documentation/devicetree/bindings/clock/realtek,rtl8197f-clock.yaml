%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/realtek,rtl8197f-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8197F SoC clock controller

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  This node is a child of the system controller (see
  Documentation/devicetree/bindings/soc/realtek/realtek,rtl8197f-syscon.yaml),
  so its reg is relative to the system controller window.

  The RTL8197F system controller holds the hardware strap register that
  multiplexes and divides the CPU clock, the crystal-select strap bit,
  and the WLAN clock/function gate.  The straps are read-only; the
  WLAN gate is programmable, because the integrated WiFi core cannot be
  accessed at all while it is closed.

properties:
  compatible:
    const: realtek,rtl8197f-clock

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    syscon@18000000 {
        compatible = "realtek,rtl8197f-syscon", "syscon", "simple-mfd";
        reg = <0x18000000 0x200>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0x0 0x18000000 0x200>;

        clock-controller@0 {
            compatible = "realtek,rtl8197f-clock";
            /* strap at 0x08, WLAN clock/function gate at 0x64 */
            reg = <0x0 0x68>;
            #clock-cells = <1>;
        };
    };
