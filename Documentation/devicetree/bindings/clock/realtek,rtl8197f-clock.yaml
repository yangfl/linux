%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/realtek,rtl8197f-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8197F SoC clock controller

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The RTL8197F system controller holds the hardware strap register that
  multiplexes and divides the CPU clock, the crystal-select strap bit,
  and the WLAN clock/function gate.  The straps are read-only; the
  WLAN gate is programmable, because the integrated WiFi core cannot be
  accessed at all while it is closed.

properties:
  compatible:
    const: realtek,rtl8197f-clock

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: xtal

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@18000000 {
        compatible = "realtek,rtl8197f-clock";
        /* strap at 0x08, WLAN clock/function gate at 0x64 */
        reg = <0x18000000 0x68>;
        clocks = <&xtal>;
        #clock-cells = <1>;
    };
