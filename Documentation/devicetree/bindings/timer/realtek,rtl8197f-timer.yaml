%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/realtek,rtl8197f-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8197F SoC timer

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The RTL8197F contains a timer block with a shared pre-divider (which it
  shares with the watchdog), two timer channels and per-channel interrupt
  enable and status bits.  TIMER0 drives the system clock event device:
  the CPU only raises the CP0 Compare condition as Cause.TI and never
  asserts it on an interrupt line.

  The register window includes the shared pre-divider (CDBR, +0x18).
  This node owns CDBR and programs it for the timer input; the watchdog
  node overlaps it at +0x18 but only reads the divider back.

properties:
  compatible:
    const: realtek,rtl8197f-timer

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-frequency: true

required:
  - compatible
  - reg
  - interrupts

oneOf:
  - required: [clocks]
  - required: [clock-frequency]

unevaluatedProperties: false

examples:
  - |
    timer@3100 {
        compatible = "realtek,rtl8197f-timer";
        reg = <0x3100 0x20>;
        interrupt-parent = <&intc>;
        interrupts = <7 4>;
        clock-frequency = <200000000>;
    };
