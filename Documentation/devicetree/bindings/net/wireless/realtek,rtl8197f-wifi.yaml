%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/realtek,rtl8197f-wifi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8197F integrated 802.11bgn WiFi

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The RTL8197F router SoC integrates an 802.11bgn 1T1R WiFi core of the
  Realtek RTL8192F (gen-2.5) family.  The core is wired directly to the
  SoC bus (not enumerated on the internal PCIe controller) and uses a
  PCI-style descriptor DMA engine.

  The MAC address is looked up in this order: a DT property (see
  mac-address / local-mac-address below, which the bootloader or a
  packaging layer can fill in from the factory MIB stored in flash), then
  the on-die eFuse, then a randomly generated locally administered address.

  Transmit power is programmed per channel from the same record.  It is
  taken whole, as one cell, and indexed by the driver: bytes 0..5 are the
  interface address, 48..61 and 62..75 the CCK levels of the two paths,
  76..89 and 90..103 the HT40 levels, 104..145 the signed per-channel
  differences for HT40 dual-stream, HT20 and OFDM (two 4-bit steps per
  byte), and 146..162 the regulatory domain, RFE type, crystal trim and
  thermal-tracking flag.  Every level byte of 0 means the board stores no
  level for that channel and the driver uses its default.

properties:
  compatible:
    const: realtek,rtl8197f-wifi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description:
          WLAN clock/function gate in the SoC system controller.  The core
          registers read back as zero while it is closed.
      - description:
          Crystal reference fed to the core, either 25 MHz or 40 MHz, which
          the core's analog front end has to be told about.

  clock-names:
    items:
      - const: core
      - const: ref

  mac-address: true

  local-mac-address: true

  nvmem-cells:
    description:
      Board efuse record - the factory calibration block of this interface,
      typically a cell of the MIB partition on the SPI NOR flash this SoC
      boots from.  At least 163 bytes; see the layout above.
    maxItems: 1

  nvmem-cell-names:
    const: efuse

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/realtek-rtl819x-clks.h>

    wifi@18640000 {
        compatible = "realtek,rtl8197f-wifi";
        reg = <0x18640000 0x10000>;
        clocks = <&sysclk RTL8197F_CLK_WLAN>,
                 <&sysclk RTL8197F_CLK_WIFI_REF>;
        clock-names = "core", "ref";
        interrupt-parent = <&intc>;
        interrupts = <29 4>;
        local-mac-address = [00 11 22 33 44 55];
    };
