%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/realtek,rtl8197f-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8197F watchdog timer

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The RTL8197F and related RTL819x SoCs have a watchdog timer in the shared
  timer register block. The register range covered by this node spans the
  timer clock divider register (CDBR, +0x18) and the watchdog control
  register (+0x1c). CDBR is owned and programmed by the timer node
  (realtek,rtl8197f-timer); this node only reads the divider back to
  convert between ticks and seconds, so the timer must be probed first.
  The watchdog has no interrupt and always resets the whole SoC when it
  times out. It is also used to perform system restarts.

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    const: realtek,rtl8197f-wdt

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    watchdog@3118 {
        compatible = "realtek,rtl8197f-wdt";
        reg = <0x3118 0x8>;

        clocks = <&lxbus_clock>;
        timeout-sec = <30>;
    };

...
