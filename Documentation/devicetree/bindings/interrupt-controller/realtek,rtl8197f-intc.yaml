%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/realtek,rtl8197f-intc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL819x SoC interrupt controller

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  Secondary interrupt controller found in the Realtek RTL819x MIPS router
  SoCs (RTL8197F and relatives), cascaded into a MIPS CPU interrupt
  controller (mti,cpu-interrupt-controller).  It has 64 inputs, split into
  two banks of 32, each with its own mask (GIMR/GIMR2) and status
  (GISR/GISR2) register.  Bank 1 is aggregated onto bank 0 input 31, which
  is therefore reserved and not usable as a regular interrupt.

  Eight routing registers (IRR0-IRR7) assign each input to one of the six
  MIPS CPU interrupt lines IP2-IP7; the routing of an input is selected by
  the second cell of its interrupt specifier.  The node must list one
  parent interrupt for every CPU line that routed inputs land on: on the
  RTL8197F these are IP2 (generic sources), IP4 (switch core), IP5 (PCIe),
  IP6 (WLAN MAC) and IP7 (CPU SI timer).

allOf:
  - $ref: /schemas/interrupt-controller.yaml#

properties:
  compatible:
    const: realtek,rtl8197f-intc

  reg:
    maxItems: 1

  interrupt-controller: true

  "#address-cells":
    const: 0

  "#interrupt-cells":
    const: 2
    description: |
      The first cell is the interrupt input number (0-63, input 31
      reserved).  The second cell is the index of the parent interrupt in
      "interrupts" whose CPU line the input is wired to; inputs are
      level-high, no trigger-type configuration is provided.

  interrupts:
    minItems: 1
    maxItems: 5
    description:
      The MIPS CPU interrupt lines this controller feeds, in the order
      referenced by the second cell of the interrupt specifiers.

required:
  - compatible
  - reg
  - interrupt-controller
  - "#interrupt-cells"
  - interrupts

additionalProperties: false

examples:
  - |
    rtl8197f_intc: interrupt-controller@3000 {
        compatible = "realtek,rtl8197f-intc";
        reg = <0x3000 0x40>;
        interrupt-controller;
        #interrupt-cells = <2>;
        interrupt-parent = <&cpuintc>;
        interrupts = <2>, <4>, <5>, <6>, <7>;
    };

    device {
        interrupt-parent = <&rtl8197f_intc>;
        interrupts = <9 0>; /* UART0, routed to the first parent (IP2) */
    };
